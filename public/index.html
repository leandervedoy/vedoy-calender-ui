<!doctype html><html lang="nb"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="/styles.css"><title>Vedøy Calender UI</title><main><p>VEDØY CALENDER UI</p><h1>Kalender med CSS.</h1><section class="cal"><header><button id="p">←</button><b id="m"></b><button id="n">→</button></header><div class="week">M T O T F L S</div><div id="g"></div></section><form id="f"><input id="t" placeholder="Nytt møte" required><input id="d" type="date" required><button>Legg til møte</button></form></main><script>let x=new Date(),e=[],s='';let g=document.querySelector('#g'),m=document.querySelector('#m');function r(){m.textContent=x.toLocaleDateString('nb-NO',{month:'long',year:'numeric'});g.innerHTML='';let a=new Date(x.getFullYear(),x.getMonth(),1),z=new Date(x.getFullYear(),x.getMonth()+1,0).getDate(),o=(a.getDay()+6)%7;for(let i=0;i<o+z;i++){let q=document.createElement('button');if(i>=o){let k=`${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(i-o+1).padStart(2,'0')}`;q.className=k==s?'sel':'';q.innerHTML=`<b>${i-o+1}</b>`+e.filter(v=>v.d==k).map(v=>`<small>${v.t}</small>`).join('');q.onclick=()=>{s=k;d.value=k;r()}}g.append(q)}}p.onclick=()=>{x.setMonth(x.getMonth()-1);r()};n.onclick=()=>{x.setMonth(x.getMonth()+1);r()};f.onsubmit=v=>{v.preventDefault();e.push({t:t.value,d:d.value});s=d.value;t.value='';r()};d.value=new Date().toISOString().slice(0,10);r()</script>
